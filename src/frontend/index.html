<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DOM Tree Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>TUAK DOM VISUALIZER</h1>

        <!--INPUT & PARSE -->
        <div class="panel step-panel" id="step1-panel">
            <div class="panel-title">1. Input HTML</div>
            <div class="input-row">
                <div class="input-col">
                    <label>URL (Link)</label>
                    <input type="text" id="url-input" placeholder="https://example.com">
                </div>
                <div class="input-col">
                    <label>Raw HTML (Optional)</label>
                    <textarea id="html-input" rows="3" placeholder="Atau paste kode HTML di sini..."></textarea>
                </div>
                <button id="parse-btn" type="button" class="action-btn">Parse</button>
            </div>
        </div>

        <!-- TRAVERSAL CONTROLS -->
        <div class="panel step-panel disabled" id="step2-panel">
            <div class="panel-title">2. Traversal Options</div>
            <div class="control-row">
                <div class="control-item">
                    <label>CSS Selector</label>
                    <input type="text" id="selector-input" placeholder="div, .class, #id, div.foo">
                </div>
                <div class="control-item">
                    <label>Algorithm</label>
                    <select id="algo-select" title="Pilih algoritma traversal">
                        <option value="BFS">BFS</option>
                        <option value="DFS">DFS</option>
                    </select>
                </div>
                <div class="control-item">
                    <label>Hasil Ditampilkan</label>
                    <div class="limit-controls">
                        <label class="radio-label">
                            <input type="radio" name="limit-type" value="all" checked> Semua
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="limit-type" value="topn"> Top
                            <input type="number" id="limit-n" value="10" min="1" class="limit-n-input" disabled>
                        </label>
                    </div>
                </div>
                <div class="control-item">
                    <label>Kecepatan Animasi</label>
                    <select id="speed-select" title="Kecepatan animasi traversal">
                        <option value="100">Lambat (100ms)</option>
                        <option value="20" selected>Normal (20ms)</option>
                        <option value="5">Cepat (5ms)</option>
                        <option value="0">Instan</option>
                    </select>
                </div>
                <button id="traverse-btn" type="button" class="action-btn" disabled>Traverse</button>
            </div>
        </div>

        <!-- VISUALIZATION & LOG -->
        <div class="workspace">
            <div class="tree-section panel">
                <div class="tree-header">
                    <div class="panel-title" style="margin-bottom:0">DOM Tree</div>
                    <div class="zoom-controls">
                        <button id="zoom-out-btn" class="zoom-btn" title="Zoom Out">−</button>
                        <span id="zoom-label">100%</span>
                        <button id="zoom-in-btn" class="zoom-btn" title="Zoom In">+</button>
                        <button id="zoom-reset-btn" class="zoom-btn" title="Reset Zoom">⟳</button>
                    </div>
                </div>
                <div id="tree-viewport">
                    <div id="tree-canvas"></div>
                </div>
            </div>

            <div class="log-section panel">
                <div class="panel-title">Traversal Log</div>
                <div class="stats-info" id="stats-info">Nodes: 0 | Depth: 0</div>
                <ul id="log-list">
                    <li class="log-placeholder">Log penelusuran akan muncul di sini...</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
